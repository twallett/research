<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node { fill: #bbdefb; stroke: #1976d2; stroke-width: 2; }
      .source { fill: #90caf9; stroke: #0d47a1; stroke-width: 3; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0d47a1; }
      .text { font-family: Arial, sans-serif; font-size: 10px; fill: #424242; text-anchor: middle; }
      .edge { stroke: #424242; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#424242" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" class="title" font-size="16">Citation Graph Structure</text>

  <!-- Legend -->
  <rect x="20" y="40" width="30" height="30" class="source" rx="15"/>
  <text x="70" y="60" class="text" text-anchor="start">Source Papers (with data)</text>

  <rect x="20" y="75" width="30" height="30" class="node" rx="15"/>
  <text x="70" y="95" class="text" text-anchor="start">Cited Papers (references)</text>

  <line x1="20" y1="115" x2="50" y2="115" class="edge"/>
  <text x="70" y="120" class="text" text-anchor="start">Citation Edge (A → B: A cites B)</text>

  <!-- Graph Nodes -->
  <!-- Source Paper 1 -->
  <circle cx="150" cy="200" r="20" class="source"/>
  <text x="150" y="205" class="text">P₁</text>

  <!-- Source Paper 2 -->
  <circle cx="300" cy="150" r="20" class="source"/>
  <text x="300" y="155" class="text">P₂</text>

  <!-- Source Paper 3 -->
  <circle cx="450" cy="200" r="20" class="source"/>
  <text x="450" y="205" class="text">P₃</text>

  <!-- Cited Papers -->
  <circle cx="300" cy="280" r="18" class="node"/>
  <text x="300" y="285" class="text">R₁</text>

  <circle cx="200" cy="350" r="18" class="node"/>
  <text x="200" y="355" class="text">R₂</text>

  <circle cx="400" cy="350" r="18" class="node"/>
  <text x="400" y="355" class="text">R₃</text>

  <circle cx="500" cy="300" r="18" class="node"/>
  <text x="500" y="305" class="text">R₄</text>

  <circle cx="100" cy="280" r="18" class="node"/>
  <text x="100" y="285" class="text">R₅</text>

  <!-- Citation Edges -->
  <!-- P1 citations -->
  <path d="M 155 220 L 290 265" class="edge"/>
  <path d="M 145 220 L 110 265" class="edge"/>
  <path d="M 160 215 L 195 335" class="edge"/>

  <!-- P2 citations -->
  <path d="M 300 170 L 300 260" class="edge"/>
  <path d="M 310 165 L 395 335" class="edge"/>

  <!-- P3 citations -->
  <path d="M 445 220 L 410 335" class="edge"/>
  <path d="M 460 215 L 495 285" class="edge"/>
  <path d="M 440 215 L 310 270" class="edge"/>

  <!-- Cross-citations between cited papers -->
  <path d="M 290 295 L 210 340" class="edge" stroke-dasharray="3,3"/>
  <path d="M 315 295 L 390 340" class="edge" stroke-dasharray="3,3"/>

  <!-- Graph Statistics Box -->
  <rect x="20" y="400" width="260" height="80" style="fill: #f5f5f5; stroke: #757575; stroke-width: 2;" rx="5"/>
  <text x="30" y="420" class="text" text-anchor="start" font-weight="bold">Graph Statistics:</text>
  <text x="30" y="440" class="text" text-anchor="start">• Nodes: 232 papers (60 source + 172 cited)</text>
  <text x="30" y="455" class="text" text-anchor="start">• Edges: 222 citation relationships</text>
  <text x="30" y="470" class="text" text-anchor="start">• Avg. degree: ~1.9 edges/node</text>

  <!-- Node Features Box -->
  <rect x="320" y="400" width="260" height="80" style="fill: #f5f5f5; stroke: #757575; stroke-width: 2;" rx="5"/>
  <text x="330" y="420" class="text" text-anchor="start" font-weight="bold">Node Features:</text>
  <text x="330" y="440" class="text" text-anchor="start">• Semantic embeddings (512-dim)</text>
  <text x="330" y="455" class="text" text-anchor="start">• Metadata: title, abstract, authors</text>
  <text x="330" y="470" class="text" text-anchor="start">• Citation count, year, venue</text>

</svg>