<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1565c0; }
      .text { font-family: Arial, sans-serif; font-size: 12px; fill: #424242; }
      .arrow { stroke: #424242; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .process { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
      .output { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#424242" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title" font-size="16">Hybrid GNN-Semantic Paper Recommendation System</text>

  <!-- Input Layer -->
  <rect x="50" y="60" width="150" height="60" class="box" rx="5"/>
  <text x="125" y="85" text-anchor="middle" class="title">Input Data</text>
  <text x="125" y="105" text-anchor="middle" class="text">Papers + Citations</text>

  <!-- Citation Graph Construction -->
  <rect x="280" y="60" width="180" height="60" class="process" rx="5"/>
  <text x="370" y="80" text-anchor="middle" class="title">Citation Graph</text>
  <text x="370" y="95" text-anchor="middle" class="text">Construction</text>
  <text x="370" y="110" text-anchor="middle" class="text">(Nodes & Edges)</text>

  <!-- Semantic Embedding -->
  <rect x="530" y="60" width="180" height="60" class="process" rx="5"/>
  <text x="620" y="80" text-anchor="middle" class="title">Semantic</text>
  <text x="620" y="95" text-anchor="middle" class="text">Embeddings</text>
  <text x="620" y="110" text-anchor="middle" class="text">(LLM: Title+Abstract)</text>

  <!-- Arrows from Input -->
  <path d="M 200 90 L 280 90" class="arrow"/>
  <path d="M 125 120 L 125 160 L 620 160 L 620 120" class="arrow"/>

  <!-- GNN Layer -->
  <rect x="280" y="180" width="180" height="80" class="process" rx="5"/>
  <text x="370" y="205" text-anchor="middle" class="title">GNN Training</text>
  <text x="370" y="225" text-anchor="middle" class="text">Architecture:</text>
  <text x="370" y="240" text-anchor="middle" class="text">GCN / GAT / SAGE</text>
  <text x="370" y="255" text-anchor="middle" class="text">3 Layers, Dropout=0.3</text>

  <!-- Arrow from Citation Graph to GNN -->
  <path d="M 370 120 L 370 180" class="arrow"/>

  <!-- GNN Embeddings -->
  <rect x="280" y="310" width="180" height="60" class="output" rx="5"/>
  <text x="370" y="330" text-anchor="middle" class="title">GNN Embeddings</text>
  <text x="370" y="345" text-anchor="middle" class="text">128-dim vectors</text>
  <text x="370" y="360" text-anchor="middle" class="text">(L2 normalized)</text>

  <!-- Arrow from GNN to GNN Embeddings -->
  <path d="M 370 260 L 370 310" class="arrow"/>

  <!-- Semantic Features -->
  <rect x="530" y="310" width="180" height="60" class="output" rx="5"/>
  <text x="620" y="330" text-anchor="middle" class="title">Text Embeddings</text>
  <text x="620" y="345" text-anchor="middle" class="text">512-dim vectors</text>
  <text x="620" y="360" text-anchor="middle" class="text">(0.3*title + 0.7*abstract)</text>

  <!-- Arrow from Semantic to Text Embeddings -->
  <path d="M 620 120 L 620 310" class="arrow"/>

  <!-- Combined Embeddings -->
  <rect x="330" y="420" width="240" height="60" class="process" rx="5"/>
  <text x="450" y="440" text-anchor="middle" class="title">Combined Embeddings</text>
  <text x="450" y="455" text-anchor="middle" class="text">Concatenate: GNN + Semantic</text>
  <text x="450" y="470" text-anchor="middle" class="text">(128 + 512 = 640-dim)</text>

  <!-- Arrows to Combined -->
  <path d="M 370 370 L 370 390 L 410 390 L 410 420" class="arrow"/>
  <path d="M 620 370 L 620 390 L 490 390 L 490 420" class="arrow"/>

  <!-- Query Processing -->
  <rect x="50" y="520" width="150" height="60" class="box" rx="5"/>
  <text x="125" y="545" text-anchor="middle" class="title">User Query</text>
  <text x="125" y="565" text-anchor="middle" class="text">"deep learning..."</text>

  <!-- Ranking & Retrieval -->
  <rect x="280" y="520" width="180" height="60" class="process" rx="5"/>
  <text x="370" y="540" text-anchor="middle" class="title">Ranking</text>
  <text x="370" y="555" text-anchor="middle" class="text">Cosine Similarity</text>
  <text x="370" y="570" text-anchor="middle" class="text">Top-K Selection</text>

  <!-- Recommendations -->
  <rect x="530" y="520" width="180" height="60" class="output" rx="5"/>
  <text x="620" y="545" text-anchor="middle" class="title">Top-K Papers</text>
  <text x="620" y="565" text-anchor="middle" class="text">Ranked Results</text>

  <!-- Arrows for query flow -->
  <path d="M 450 480 L 450 500 L 370 500 L 370 520" class="arrow"/>
  <path d="M 200 550 L 280 550" class="arrow"/>
  <path d="M 460 550 L 530 550" class="arrow"/>

</svg>